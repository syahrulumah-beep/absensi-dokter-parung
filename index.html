<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}[hidden]{display:none!important}</style>
<title>Sistem Pengingat Absensi Dokter Spesialis Klinik Utama Rawat Inap Parung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap">
<style>
/* Tata letak: sidebar biru tua tetap di kiri, area kerja terang di kanan.
   Jadwal dibaca seperti papan jaga klinik: jam di kiri, dokter di tengah, status di kanan. */
:root{
  --bg:#f2f5fa; --surface:#ffffff; --surface-2:#f6f8fc; --line:#dbe3f0; --line-strong:#c3cee2;
  --fg:#0e1c38; --muted:#586a89;
  --primary:#0b2a5b; --primary-hover:#123a7d; --primary-fg:#ffffff;
  --sky:#e3f1fd; --sky-line:#b9dcf8; --sky-fg:#0a4a85; --sky-strong:#4aa8ef;
  --side-bg:#0b2a5b; --side-fg:#e8f0fc; --side-muted:#9db4dc; --side-active:#173b78; --side-line:#264a8a;
  --ok:#0f6b42; --ok-bg:#dff4e8; --warn:#8a5200; --warn-bg:#fdf0d2; --bad:#a82a22; --bad-bg:#fde4e1; --idle:#4b5873; --idle-bg:#e8ecf4;
  --focus:#2b8be0; --shadow:0 1px 2px rgba(14,28,56,.06),0 4px 14px rgba(14,28,56,.05); --overlay:rgba(8,18,38,.5);
  --f-head:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#09111f; --surface:#0f1a2e; --surface-2:#13213a; --line:#1f3050; --line-strong:#2d4570;
  --fg:#e5ecf8; --muted:#92a4c4;
  --primary:#4a9af0; --primary-hover:#69adf4; --primary-fg:#06142b;
  --sky:#12294a; --sky-line:#1f4778; --sky-fg:#9fd0fa; --sky-strong:#4aa8ef;
  --side-bg:#07142b; --side-fg:#e3ecfa; --side-muted:#8ea3c8; --side-active:#12295a; --side-line:#1a3263;
  --ok:#6ad49c; --ok-bg:#103423; --warn:#f0c068; --warn-bg:#3a2a0b; --bad:#ff9a92; --bad-bg:#43191a; --idle:#a9b6cf; --idle-bg:#1b2840;
  --focus:#69adf4; --shadow:0 1px 2px rgba(0,0,0,.3); --overlay:rgba(2,6,14,.65); color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#09111f; --surface:#0f1a2e; --surface-2:#13213a; --line:#1f3050; --line-strong:#2d4570;
  --fg:#e5ecf8; --muted:#92a4c4;
  --primary:#4a9af0; --primary-hover:#69adf4; --primary-fg:#06142b;
  --sky:#12294a; --sky-line:#1f4778; --sky-fg:#9fd0fa; --sky-strong:#4aa8ef;
  --side-bg:#07142b; --side-fg:#e3ecfa; --side-muted:#8ea3c8; --side-active:#12295a; --side-line:#1a3263;
  --ok:#6ad49c; --ok-bg:#103423; --warn:#f0c068; --warn-bg:#3a2a0b; --bad:#ff9a92; --bad-bg:#43191a; --idle:#a9b6cf; --idle-bg:#1b2840;
  --focus:#69adf4; --shadow:0 1px 2px rgba(0,0,0,.3); --overlay:rgba(2,6,14,.65); color-scheme:dark; }

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14.5px;line-height:1.5;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--side-bg)}
h1,h2,h3{font-family:var(--f-head);margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ===== Kerangka ===== */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.side{background:var(--side-bg);color:var(--side-fg);position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:100vh;overflow-y:auto;z-index:40}
.side-inner{display:flex;flex-direction:column;min-height:100%;padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;gap:18px}
.brand{display:flex;gap:11px;align-items:center}
.brand-mark{width:38px;height:38px;border-radius:10px;background:var(--sky-strong);color:#06234a;display:grid;place-items:center;flex:none}
.brand-mark .ic{width:22px;height:22px;stroke-width:2.2}
.brand-text{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.brand-text strong{font-family:var(--f-head);font-size:15px;font-weight:800}
.brand-text span{font-size:12px;color:var(--side-muted)}
.clinic{font-size:12px;color:var(--side-muted);border-top:1px solid var(--side-line);padding-top:14px;line-height:1.4}
.clinic b{display:block;color:var(--side-fg);font-weight:600;font-size:13px}
#nav{display:flex;flex-direction:column;gap:3px}
.nav-i{display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;border:0;border-radius:9px;background:transparent;color:var(--side-fg);text-align:left;font-size:14px;font-weight:500}
.nav-i:hover{background:var(--side-active)}
.nav-i[aria-current="page"]{background:var(--side-active);box-shadow:inset 3px 0 0 var(--sky-strong);font-weight:600}
.nav-i .lbl{flex:1;min-width:0}
.badge{background:#ff6b5e;color:#2b0500;font-size:11.5px;font-weight:700;border-radius:999px;min-width:20px;padding:1px 6px;text-align:center}
.side-foot{margin-top:auto;border-top:1px solid var(--side-line);padding-top:14px;font-size:12px;color:var(--side-muted);display:flex;flex-direction:column;gap:6px}
.side-foot .clock{color:var(--side-fg);font-weight:600;font-size:13px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--sky-strong)}
.dot.warn{background:#f0b449}
.main{min-width:0}
.main-inner{padding-block:26px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1280px}
.topbar{display:none}
.scrim{display:none}

/* ===== Elemen umum ===== */
.page-head{display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;align-items:flex-end;margin-bottom:20px}
.page-head h1{font-size:25px;font-weight:800}
.sub{margin:4px 0 0;color:var(--muted);max-width:60ch}
.head-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--line)}
.card-h h2{font-size:15.5px;font-weight:700}
.card-b{padding:16px 18px}
.btn{display:inline-flex;align-items:center;gap:8px;justify-content:center;border:1px solid var(--line-strong);background:var(--surface);color:var(--fg);padding:8px 14px;border-radius:9px;font-weight:600;font-size:13.5px;text-decoration:none;line-height:1.2;min-height:38px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-fg)}
.btn.primary:hover{background:var(--primary-hover)}
.btn.wa{background:var(--sky);border-color:var(--sky-line);color:var(--sky-fg)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger.solid{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{padding:5px 10px;min-height:32px;font-size:12.5px;gap:6px}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
.icon-btn{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:9px;border:1px solid var(--line-strong);background:var(--surface);color:var(--fg)}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn.plain{border-color:transparent;background:transparent}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:600;white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)} .chip.idle{background:var(--idle-bg);color:var(--idle)}
.chip.sky{background:var(--sky);color:var(--sky-fg)}
.selw{position:relative;display:inline-block}
.selw select{appearance:none;-webkit-appearance:none;border:1px solid transparent;border-radius:999px;padding:4px 28px 4px 11px;font-weight:600;font-size:12.5px;cursor:pointer;max-width:100%}
.selw::after{content:"";position:absolute;right:11px;top:50%;width:6px;height:6px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:translateY(-70%) rotate(45deg);pointer-events:none}
.selw.ok{color:var(--ok)} .selw.ok select{background:var(--ok-bg)}
.selw.warn{color:var(--warn)} .selw.warn select{background:var(--warn-bg)}
.selw.bad{color:var(--bad)} .selw.bad select{background:var(--bad-bg)}
.selw.idle{color:var(--idle)} .selw.idle select{background:var(--idle-bg)}
.selw select{color:inherit}
.selw select option{color:var(--fg);background:var(--surface)}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>span,.lbl-t{font-size:12.5px;font-weight:600;color:var(--muted)}
input[type=text],input[type=tel],input[type=date],input[type=time],input[type=number],input[type=search],input[type=datetime-local],select.in,textarea{width:100%;min-width:0;border:1px solid var(--line-strong);background:var(--surface);border-radius:9px;padding:8px 11px;min-height:38px}
textarea{resize:vertical;min-height:96px;line-height:1.5}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.8}
.hint{font-size:12.5px;color:var(--muted)}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:14px}
.toolbar .fld{flex:1 1 150px}
.toolbar .grow{flex:2 1 220px}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:10px;padding:3px;background:var(--surface-2);gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:7px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--primary);color:var(--primary-fg)}
.seg .cnt{margin-left:6px;font-size:11.5px;background:var(--bad-bg);color:var(--bad);border-radius:999px;padding:0 6px}
.seg button.on .cnt{background:var(--primary-fg);color:var(--primary)}
.banner{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;border:1px solid var(--sky-line);background:var(--sky);color:var(--sky-fg);border-radius:11px;padding:11px 14px;margin-bottom:16px}
.banner .ic{margin-top:2px}
.banner p{margin:0;flex:1 1 260px}
.banner.warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.banner.bad{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.empty{padding:34px 18px;text-align:center;color:var(--muted)}
.empty h3{font-size:16px;color:var(--fg);margin-bottom:6px}
.empty .btn{margin-top:12px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--sky);color:var(--sky-fg);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none;font-family:var(--f-head)}

/* ===== Statistik & dashboard ===== */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);min-width:0}
.stat-top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px;font-weight:600}
.stat-val{font-family:var(--f-head);font-size:34px;font-weight:800;line-height:1.1;margin:8px 0 2px;font-variant-numeric:tabular-nums}
.stat-sub{font-size:12.5px;color:var(--muted)}
.stat.ok .stat-val{color:var(--ok)} .stat.warn .stat-val{color:var(--warn)}
.dash-grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:16px;align-items:start}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.date-nav{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.date-nav input{width:auto;min-width:150px}
.srow{display:grid;grid-template-columns:112px minmax(0,1fr) auto;gap:6px 14px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.srow .t{font-family:var(--f-mono);font-weight:500;font-size:13.5px;font-variant-numeric:tabular-nums}
.srow .who{display:flex;gap:11px;align-items:center;min-width:0}
.srow .who div{min-width:0}
.srow .nm{font-weight:600;overflow-wrap:anywhere}
.srow .sp{font-size:12.5px;color:var(--muted)}
.srow .act{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.srow .note{grid-column:2/-1;font-size:12.5px;color:var(--muted)}
.nrow{padding:11px 18px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:5px}
.nrow:last-child{border-bottom:0}
.nrow .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.nrow .nm{font-weight:600}
.nrow .meta{font-size:12.5px;color:var(--muted)}
.nrow .btns{display:flex;gap:6px;flex-wrap:wrap}
.daylbl{padding:8px 18px;background:var(--surface-2);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);border-bottom:1px solid var(--line)}

/* ===== Tabel ===== */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:10px 14px;background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.days{display:flex;gap:3px;flex-wrap:wrap}
.days i{font-style:normal;font-size:11.5px;font-weight:600;padding:1px 6px;border-radius:5px;background:var(--sky);color:var(--sky-fg)}
.row-act{display:flex;gap:6px;flex-wrap:wrap}
.cell-name{display:flex;gap:10px;align-items:center;min-width:180px}
.note-in{min-width:150px;padding:6px 9px;min-height:34px}
.sumbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}

/* ===== Kalender ===== */
.cal-wrap{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;padding:14px 16px 16px}
.cal-h{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:center;padding:4px 0}
.cal-d{min-height:64px;border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:6px 7px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;text-align:left;gap:4px;min-width:0}
.cal-d:hover{border-color:var(--sky-strong)}
.cal-d .n{font-weight:600;font-size:13.5px;font-variant-numeric:tabular-nums}
.cal-d.out{background:var(--surface-2);color:var(--muted)}
.cal-d.today .n{background:var(--primary);color:var(--primary-fg);border-radius:999px;min-width:24px;height:24px;display:grid;place-items:center;padding:0 5px;margin:-3px 0 0 -3px}
.cal-d.sel{border-color:var(--primary);background:var(--sky);box-shadow:0 0 0 2px var(--sky-strong) inset}
.cal-d .mk{display:flex;gap:3px;align-items:center;flex-wrap:wrap}
.cal-d .cnt{font-size:11.5px;font-weight:700;background:var(--sky-strong);color:#04213f;border-radius:5px;padding:0 6px;min-width:20px;text-align:center}
.cal-d .pt{width:7px;height:7px;border-radius:50%;background:var(--idle)}
.pt.ok{background:var(--ok)} .pt.warn{background:#e0a02c} .pt.bad{background:var(--bad)} .pt.idle{background:var(--idle)}
.legend{display:flex;gap:14px;flex-wrap:wrap;padding:0 16px 14px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* ===== Pengingat ===== */
.rem{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.rem:last-child{border-bottom:0}
.rem-top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.rem .nm{font-family:var(--f-head);font-weight:700;font-size:16px;overflow-wrap:anywhere}
.rem dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 14px;font-size:13.5px}
.rem dt{color:var(--muted)} .rem dd{margin:0}
.rem details summary{cursor:pointer;font-size:13px;color:var(--sky-fg);font-weight:600}
.rem pre{white-space:pre-wrap;font-family:var(--f-body);background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin:8px 0 0;font-size:13.5px}
.rem .btns{display:flex;gap:8px;flex-wrap:wrap}

/* ===== Modal & toast ===== */
.modal-backdrop{position:fixed;inset:0;background:var(--overlay);z-index:100;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);color:var(--fg);border-radius:14px;border:1px solid var(--line);width:min(640px,100%);max-height:100%;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal.sm{width:min(460px,100%)}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-head h2{font-size:18px;font-weight:800}
.modal-body{padding:18px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:14px;min-height:0}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.chk-row{display:flex;gap:6px;flex-wrap:wrap}
.chk{position:relative}
.chk input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.chk span{display:inline-block;border:1px solid var(--line-strong);border-radius:8px;padding:6px 12px;font-weight:600;font-size:13px;background:var(--surface);min-width:48px;text-align:center}
.chk input:checked+span{background:var(--primary);color:var(--primary-fg);border-color:var(--primary)}
.chk input:focus-visible+span{outline:2px solid var(--focus);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.dchip{display:inline-flex;align-items:center;gap:6px;background:var(--sky);color:var(--sky-fg);border-radius:8px;padding:3px 4px 3px 10px;font-size:13px;font-weight:600}
.dchip button{border:0;background:transparent;color:inherit;width:22px;height:22px;border-radius:5px;display:grid;place-items:center;padding:0}
.dchip button:hover{background:var(--sky-line)}
.preview{border:1px dashed var(--line-strong);border-radius:10px;padding:10px 12px;background:var(--surface-2);font-size:13.5px;display:flex;flex-direction:column;gap:5px}
.preview .err{color:var(--bad);font-weight:600}
.preview .wrn{color:var(--warn)}
.preview .good{color:var(--ok);font-weight:600}
.switch{display:flex;align-items:center;gap:10px;font-weight:600}
.switch input{width:20px;height:20px;accent-color:var(--primary)}
.toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:200;display:flex;flex-direction:column;gap:8px;max-width:min(380px,calc(100vw - 32px))}

<script>
'use strict';
/* ===================== Utilitas tanggal & format ===================== */
// <dates>
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parseYmd = s => { const p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); };
const todayStr = () => ymd(new Date());
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
// </dates>
const HARI = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const HARI_S = ['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
const BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const BULAN_S = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const WEEK_ORDER = [1,2,3,4,5,6,0];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = (s, r) => (r || document).querySelector(s);
const fmtLong = s => { const d = parseYmd(s); return HARI[d.getDay()] + ', ' + d.getDate() + ' ' + BULAN[d.getMonth()] + ' ' + d.getFullYear(); };
const fmtShort = s => { const d = parseYmd(s); return d.getDate() + ' ' + BULAN_S[d.getMonth()] + ' ' + d.getFullYear(); };
const fmtDay = s => { const d = parseYmd(s); return HARI_S[d.getDay()] + ', ' + d.getDate() + ' ' + BULAN_S[d.getMonth()]; };
const dotT = t => String(t || '').replace(':', '.');
const fmtJam = (a, b) => dotT(a) + '–' + dotT(b);
const toMin = t => { const p = t.split(':').map(Number); return p[0] * 60 + p[1]; };
const dtOf = (date, time) => { const a = date.split('-').map(Number), b = time.split(':').map(Number); return new Date(a[0], a[1] - 1, a[2], b[0], b[1]); };
const fmtDT = d => d.getDate() + ' ' + BULAN_S[d.getMonth()] + ' ' + d.getFullYear() + ', ' + pad(d.getHours()) + '.' + pad(d.getMinutes());
const fmtStamp = ms => fmtDT(new Date(ms));
const relDay = s => { const t = todayStr(); if (s === t) return 'Hari ini'; if (s === addDays(t, 1)) return 'Besok'; return fmtDay(s); };
const uid = p => p + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const ic = n => '<svg class="ic" aria-hidden="true"><use href="#i-' + n + '"/></svg>';

/* ===================== Data awal contoh ===================== */
// <seed>
function buildSeed(t) {
  const D = [
    ['dok-pd','dr.','Andi Prasetyo','Sp.PD','Spesialis Penyakit Dalam','081200000001',[1,3,5],'08:00','12:00'],
    ['dok-anak','dr.','Ratna Wulandari','Sp.A','Spesialis Anak','081200000002',[1,2,4],'09:00','13:00'],
    ['dok-og','dr.','Maya Kusuma','Sp.OG','Spesialis Obstetri dan Ginekologi','081200000003',[2,4,6],'10:00','14:00'],
    ['dok-bedah','dr.','Bambang Hartono','Sp.B','Spesialis Bedah','081200000004',[3,5],'13:00','17:00'],
    ['dok-rad','dr.','Dewi Anggraini','Sp.Rad','Spesialis Radiologi','081200000005',[1,4],'08:00','11:00'],
    ['dok-paru','dr.','Rizal Firmansyah','Sp.P','Spesialis Paru','081200000006',[1,3],'14:00','17:00'],
    ['dok-pk','dr.','Sinta Maharani','Sp.PK','Spesialis Patologi Klinik','081200000007',[5,6],'08:00','12:00']
  ];
  const doctors = {}, schedules = {};
  D.forEach((r, i) => {
    doctors[r[0]] = { prefix: r[1], name: r[2], suffix: r[3], specialty: r[4], phone: r[5], days: r[6], start: r[7], end: r[8], active: true, sample: true, createdAt: 1000 + i };
    for (let k = 0; k < 7; k++) {
      const date = addDays(t, k);
      if (r[6].indexOf(parseYmd(date).getDay()) >= 0) {
        schedules['s-' + r[0] + '-' + date] = { doctorId: r[0], date: date, start: r[7], end: r[8], attendance: 'belum', note: '', remind: { mode: '1d' }, remindDone: false, sample: true, createdAt: 1000 + i };
      }
    }
  });
  const first = schedules['s-dok-pd-' + t];
  if (first) first.attendance = 'sudah';
  return { doctors: doctors, schedules: schedules };
}
// </seed>

/* ===================== Status & pengaturan bawaan ===================== */
const ST = {
  belum: { label: 'Belum absensi', cls: 'warn' },
  sudah: { label: 'Sudah absensi', cls: 'ok' },
  tidak_hadir: { label: 'Tidak hadir', cls: 'bad' },
  dibatalkan: { label: 'Jadwal dibatalkan', cls: 'idle' }
};
const SPECIALTIES = ['Spesialis Penyakit Dalam','Spesialis Anak','Spesialis Obstetri dan Ginekologi','Spesialis Bedah','Spesialis Radiologi','Spesialis Paru','Spesialis Patologi Klinik'];
const DEFAULT_TEMPLATE = 'Yth. {nama_dokter}, kami mengingatkan bahwa jadwal praktik di {klinik} pada tanggal {tanggal} pukul {jam}. Mohon melakukan absensi kehadiran sesuai jadwal. Terima kasih.';
const DEFAULT_SETTINGS = { clinicName: 'Klinik Utama Rawat Inap Parung', adminName: '', template: DEFAULT_TEMPLATE, defaultRemind: { mode: '1d', value: 30, unit: 'menit' }, sampleDismissed: false };

const S = {
  mode: 'loading', loaded: false, slow: false, readOnly: false, dbError: '',
  doctors: {}, schedules: {}, logs: {}, settings: JSON.parse(JSON.stringify(DEFAULT_SETTINGS)),
  ui: { page: 'dashboard', dashDate: null, calMonth: null, calSel: null, calDoc: '', remTab: 'due', f: {} }
};
(function initFilters() {
  const t = todayStr(), d = parseYmd(t);
  S.ui.calMonth = t.slice(0, 7);
  S.ui.calSel = t;
  S.ui.f = {
    docQ: '', docSpec: '', docStatus: '',
    monPreset: 'today', monFrom: t, monTo: t, monDoc: '', monSpec: '', monStatus: '',
    repTab: 'jadwal', repDoc: '', repSpec: '',
    repFrom: ymd(new Date(d.getFullYear(), d.getMonth(), 1)), repTo: ymd(new Date(d.getFullYear(), d.getMonth() + 1, 0))
  };
})();

/* ===================== Akses data ===================== */
const docName = d => (d.prefix ? d.prefix + ' ' : '') + d.name + (d.suffix ? ', ' + d.suffix : '');
const GONE = { name: '(Dokter dihapus)', prefix: '', suffix: '', specialty: '-', phone: '', days: [], active: false };
const dOf = s => S.doctors[s.doctorId] || GONE;
const docs = () => Object.values(S.doctors).sort((a, b) => docName(a).localeCompare(docName(b), 'id'));
const scheds = () => Object.values(S.schedules);
const schedulesOn = d => scheds().filter(s => s.date === d);
const byTime = (a, b) => a.date.localeCompare(b.date) || a.start.localeCompare(b.start) || docName(dOf(a)).localeCompare(docName(dOf(b)), 'id');
const initials = d => d.name.split(/\s+/).slice(0, 2).map(w => w[0] || '').join('').toUpperCase();

function remindAt(s) {
  const st = dtOf(s.date, s.start), r = s.remind || { mode: '1d' };
  if (r.mode === '3h') return new Date(st.getTime() - 3 * 3600000);
  if (r.mode === '1h') return new Date(st.getTime() - 3600000);
  if (r.mode === 'abs' && r.abs) { const p = r.abs.split('T'), a = p[0].split('-').map(Number), b = p[1].split(':').map(Number); return new Date(a[0], a[1] - 1, a[2], b[0], b[1]); }
  if (r.mode === 'custom') { const u = r.unit === 'hari' ? 86400000 : r.unit === 'jam' ? 3600000 : 60000; return new Date(st.getTime() - (Number(r.value) || 0) * u); }
  return new Date(st.getTime() - 86400000);
}
function remLabel(r) {
  r = r || { mode: '1d' };
  if (r.mode === '3h') return '3 jam sebelumnya';
  if (r.mode === '1h') return '1 jam sebelumnya';
  if (r.mode === 'custom') return r.value + ' ' + r.unit + ' sebelumnya';
  if (r.mode === 'abs') return 'Waktu khusus';
  return '1 hari sebelumnya';
}
function reminderGroups(now) {
  now = now || new Date();
  const g = { due: [], upcoming: [], done: [] };
  scheds().forEach(s => {
    if (s.attendance === 'dibatalkan') return;
    if (s.remindDone) { g.done.push(s); return; }
    if (s.attendance !== 'belum') return;
    if (dtOf(s.date, s.end) <= now) return;
    (remindAt(s) <= now ? g.due : g.upcoming).push(s);
  });
  g.due.sort(byTime);
  g.upcoming.sort((a, b) => remindAt(a) - remindAt(b));
  g.done.sort((a, b) => byTime(b, a));
  return g;
}
function findConflicts(doctorId, date, start, end, exceptId) {
  return scheds().filter(s => s.doctorId === doctorId && s.date === date && s.id !== exceptId && s.attendance !== 'dibatalkan' && toMin(start) < toMin(s.end) && toMin(s.start) < toMin(end));
}
function waNumber(p) {
  let n = String(p || '').replace(/\D/g, '');
  if (!n) return '';
  if (n.startsWith('0')) n = '62' + n.slice(1); else if (n.startsWith('8')) n = '62' + n;
  return n;
}
function waMessage(s) {
  const d = dOf(s), set = S.settings;
  return String(set.template || DEFAULT_TEMPLATE)
    .split('{nama_dokter}').join(docName(d))
    .split('{spesialisasi}').join(d.specialty)
    .split('{tanggal}').join(fmtLong(s.date))
    .split('{jam}').join(fmtJam(s.start, s.end) + ' WIB')
    .split('{klinik}').join(set.clinicName || DEFAULT_SETTINGS.clinicName);
}

/* ===================== Penyimpanan ===================== */
const LS_KEY = 'absensi-dokter-parung:v1';
let DB = null;

function saveLocal() {
  try { localStorage.setItem(LS_KEY, JSON.stringify({ doctors: S.doctors, schedules: S.schedules, logs: S.logs, settings: S.settings })); return true; }
  catch (e) { if (S.mode === 'local') { S.mode = 'memory'; } return false; }
}
function loadLocal() {
  let raw = null;
  try { raw = localStorage.getItem(LS_KEY); } catch (e) { S.mode = 'memory'; }
  if (S.mode !== 'memory') S.mode = 'local';
  if (raw) {
    try {
      const o = JSON.parse(raw);
      ['doctors', 'schedules', 'logs'].forEach(k => { S[k] = o[k] || {}; Object.keys(S[k]).forEach(id => { S[k][id].id = id; }); });
      S.settings = Object.assign({}, JSON.parse(JSON.stringify(DEFAULT_SETTINGS)), o.settings || {});
    } catch (e) { /* data rusak: mulai kosong */ }
  } else {
    const seed = buildSeed(todayStr());
    Object.keys(seed.doctors).forEach(id => { S.doctors[id] = Object.assign({ id: id }, seed.doctors[id]); });
    Object.keys(seed.schedules).forEach(id => { S.schedules[id] = Object.assign({ id: id }, seed.schedules[id]); });
    saveLocal();
  }
  S.loaded = true;
}
function dbFail(e) {
  const code = e && e.code;
  if (code === 'invalid_argument') { S.readOnly = true; toast('Akun ini tidak memiliki izin mengubah data. Hanya pemilik atau editor yang dapat menyimpan.', 'err'); }
  else if (code === 'quota_exceeded') toast('Penyimpanan penuh. Hapus sebagian data lama lalu coba lagi.', 'err');
  else toast('Perubahan belum tersimpan. Periksa koneksi lalu coba lagi.', 'err');
  render();
}
async function put(col, id, data) {
  const obj = Object.assign({}, data); delete obj.id;
  if (S.mode === 'db') {
    try { await DB.doc(col + '/' + id).set(obj); return true; } catch (e) { dbFail(e); return false; }
  }
  S[col][id] = Object.assign({ id: id }, obj);
  saveLocal(); render(); return true;
}
async function del(col, id) {
  if (S.mode === 'db') {
    try { await DB.doc(col + '/' + id).delete(); return true; } catch (e) { dbFail(e); return false; }
  }
  delete S[col][id]; saveLocal(); render(); return true;
}
async function putSettings(patch) {
  const next = Object.assign({}, S.settings, patch);
  if (S.mode === 'db') {
    try { await DB.doc('settings/main').set(next); return true; } catch (e) { dbFail(e); return false; }
  }
  S.settings = next; saveLocal(); render(); return true;
}
async function runLimited(tasks, n) {
  let i = 0, ok = true;
  async function worker() { while (i < tasks.length) { const t = tasks[i++]; const r = await t(); if (r === false) ok = false; } }
  await Promise.all(Array.from({ length: Math.min(n, tasks.length) }, worker));
  return ok;
}
function subscribeDb() {
  const got = {};
  const timer = setTimeout(() => { if (!S.loaded) { S.slow = true; render(); } }, 10000);
  const mark = (k, snap) => {
    if (!snap.metadata.fromCache) got[k] = true;

  return cells;
}

function presetRange(p) {
  const t = todayStr(), d = parseYmd(t);
  if (p === 'today') return [t, t];
  if (p === 'week') { const mon = addDays(t, -((d.getDay() + 6) % 7)); return [mon, addDays(mon, 6)]; }
  if (p === 'month') return [ymd(new Date(d.getFullYear(), d.getMonth(), 1)), ymd(new Date(d.getFullYear(), d.getMonth() + 1, 0))];
  return null;
}

}

  if (tab === 'jadwal') return { title: 'Riwayat Jadwal Praktik Dokter', period: period, head: ['No.', 'Tanggal', 'Dokter', 'Spesialisasi', 'Jam', 'Status', 'Keterangan'], rows: list.map((s, i) => [i + 1, fmtShort(s.date), docName(dOf(s)), dOf(s).specialty, fmtJam(s.start, s.end), ST[s.attendance].label, s.note || '']), file: 'Riwayat-Jadwal' };

  const ae = document.activeElement, id = ae && ae.id && $('#modal-root').contains(ae) ? ae.id : null;

  else if (first) { const f = $('#modal-root input:not([type=checkbox]):not([hidden]), #modal-root select, #modal-root .btn'); if (f) { try { f.focus({ preventScroll: true }); } catch (e) { /* abaikan */ } } }

async function saveDoctor() {
  const m = M, name = m.name.trim(), spec = m.specialty.trim();
  const fail = t => { m.error = t; const e = $('#m-err'); e.hidden = false; e.innerHTML = '<span class="err">' + esc(t) + '</span>'; };
  if (!name) return fail('Nama dokter wajib diisi.');
  if (!spec) return fail('Spesialisasi wajib diisi.');
  if (!m.days.length) return fail('Pilih minimal satu hari praktik.');
  if (!m.start || !m.end || toMin(m.end) <= toMin(m.start)) return fail('Jam selesai harus setelah jam mulai.');
  const num = waNumber(m.phone);
  if (m.phone.trim() && (num.length < 9 || num.length > 15)) return fail('Nomor telepon tidak valid. Gunakan 9 sampai 15 digit.');
  const dup = docs().find(d => d.id !== m.editId && d.name.trim().toLowerCase() === name.toLowerCase() && d.specialty.trim().toLowerCase() === spec.toLowerCase());
  if (dup) return fail('Dokter dengan nama dan spesialisasi yang sama sudah terdaftar.');
  const old = m.editId ? S.doctors[m.editId] : null;
  const data = Object.assign({}, old || {}, { prefix: m.prefix.trim(), name: name, suffix: m.suffix.trim(), specialty: spec, phone: m.phone.trim(), days: m.days.slice().sort(), start: m.start, end: m.end, active: !!m.active, sample: false, createdAt: old ? old.createdAt : Date.now() });
  const ok = await put('doctors', m.editId || uid('dok'), data);
  if (ok) { closeModal(); toast(m.editId ? 'Data dokter diperbarui' : 'Dokter ditambahkan'); }
}

function remindFromM() {

}
function calcSched() {

  if (!m.start || !m.end) out.errors.push('Isi jam mulai dan jam selesai.');
  else if (toMin(m.end) <= toMin(m.start)) out.errors.push('Jam selesai harus setelah jam mulai.');
  let dates = [];
  if (m.editId) { if (!m.date) out.errors.push('Pilih tanggal praktik.'); else dates = [m.date]; }
  else if (m.tab === 'dates') { dates = m.dates.slice().sort(); if (!dates.length) out.errors.push('Tambahkan minimal satu tanggal.'); }

    if (!m.weekdays.length) out.errors.push('Pilih minimal satu hari.');
    else if (!m.from || !m.to) out.errors.push('Isi rentang tanggal.');
    else if (m.to < m.from) out.errors.push('Tanggal akhir harus setelah tanggal mulai.');
    else if (parseYmd(m.to) - parseYmd(m.from) > 366 * 86400000) out.errors.push('Rentang maksimal satu tahun.');
    else { let d = m.from; while (d <= m.to) { if (m.weekdays.indexOf(parseYmd(d).getDay()) >= 0) dates.push(d); d = addDays(d, 1); } if (!dates.length) out.errors.push('Tidak ada tanggal yang cocok pada rentang ini.'); }
  }
  const r = remindFromM();
  if (m.remMode === 'custom' && m.remKind === 'rel' && !(parseInt(m.remVal, 10) > 0)) out.errors.push('Selisih pengingat harus lebih dari 0.');
  if (r.mode === 'abs') {
    if (!r.abs) out.errors.push('Isi tanggal dan jam pengingat.');
    else if (dates.length > 1) out.errors.push('Waktu pengingat tertentu hanya untuk satu jadwal. Gunakan selisih sebelum jadwal untuk banyak tanggal.');
    else if (dates.length === 1 && m.start && r.abs >= dates[0] + 'T' + m.start) out.errors.push('Waktu pengingat harus sebelum jam mulai praktik.');
  }
  if (!out.errors.length) dates.forEach(date => {
    const c = findConflicts(m.doctorId, date, m.start, m.end, m.editId);
    if (c.length) out.conflicts.push({ date: date, with: c[0] }); else out.items.push(date);
    if (doc && (doc.days || []).indexOf(parseYmd(date).getDay()) < 0) out.offDays.push(date);

}

const libs = {};
function loadLib(key, urls, test) {
  if (test()) return Promise.resolve();
  if (libs[key]) return libs[key];
  libs[key] = (async () => {
    for (const u of urls) {
      try { await new Promise((res, rej) => { const sc = document.createElement('script'); sc.src = u; sc.onload = res; sc.onerror = () => rej(new Error('gagal')); document.head.appendChild(sc); }); if (test()) return; } catch (e) { /* coba sumber berikutnya */ }
    }
    throw new Error('Pustaka ekspor tidak dapat dimuat');
  })();
  libs[key].catch(() => { delete libs[key]; });
  return libs[key];
}
async function saveFile(filename, data) {
  let dl = null;
  try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (e) { dl = null; }
  if (!dl) {
    try {
      const blob = data instanceof Blob ? data : new Blob([data], { type: filename.endsWith('.pdf') ? 'application/pdf' : filename.endsWith('.json') ? 'application/json' : 'application/octet-stream' });
      const url = URL.createObjectURL(blob), a = document.createElement('a');
      a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      toast('Berkas diunduh: ' + filename);
    } catch (e) { toast('Unduhan gagal dibuat di peramban ini.', 'err'); }
    return;
  }
  try { await dl.save({ filename: filename, data: data }); toast('Berkas siap: ' + filename); }
  catch (e) { if (e && e.code === 'declined') return; toast('Berkas gagal disimpan (' + ((e && e.code) || 'kesalahan') + ').', 'err'); }
}

    case 'menu-close': closeMenu(); break;
    case 'dash-prev': S.ui.dashDate = addDays(S.ui.dashDate || todayStr(), -1); render(); break;
    case 'dash-next': S.ui.dashDate = addDays(S.ui.dashDate || todayStr(), 1); render(); break;
    case 'dash-today': S.ui.dashDate = null; render(); break;
    case 'doc-add': openDoctorModal(); break;
    case 'doc-edit': openDoctorModal(id); break;
    case 'doc-toggle': { const d = S.doctors[id]; if (d) put('doctors', id, Object.assign({}, d, { active: !d.active })); break; }
    case 'doc-del': { const d = S.doctors[id]; if (!d) break; const n = scheds().filter(s => s.doctorId === id).length; askConfirm({ title: 'Hapus dokter?', body: '<b>' + esc(docName(d)) + '</b> akan dihapus' + (n ? ' bersama <b>' + n + ' jadwal</b> miliknya' : '') + '. Tindakan ini tidak dapat dibatalkan. Untuk menghentikan sementara, ubah status menjadi nonaktif.', ok: 'Hapus dokter', danger: true, fn: async () => { const ok = await deleteDoctorCascade(id); if (ok) toast('Dokter dihapus'); } }); break; }
    case 'doc-save': await saveDoctor(); break;
    case 'sched-add': if (el.dataset.doctor && S.doctors[el.dataset.doctor] && !S.doctors[el.dataset.doctor].active) { toast('Dokter ini nonaktif. Aktifkan dulu di Data Dokter.', 'err'); break; } if (!docs().some(d => d.active)) { toast('Tambahkan atau aktifkan dokter terlebih dahulu.', 'err'); go('dokter'); break; } openSchedModal({ date: el.dataset.date || S.ui.calSel || todayStr(), doctor: el.dataset.doctor }); break;
    case 'sched-edit': openSchedModal({ id: id }); break;
    case 'sched-del': { const s = S.schedules[id]; if (!s) break; askConfirm({ title: 'Hapus jadwal?', body: 'Jadwal <b>' + esc(docName(dOf(s))) + '</b> pada <b>' + fmtLong(s.date) + '</b> (' + fmtJam(s.start, s.end) + ') akan dihapus.', ok: 'Hapus jadwal', danger: true, fn: async () => { const ok = await del('schedules', id); if (ok) toast('Jadwal dihapus'); } }); break; }
    case 'sched-save': await saveSched(); break;
    case 'quick-hadir': await setAttendance(id, 'sudah'); break;
    case 'cal-prev': { const p = S.ui.calMonth.split('-').map(Number); S.ui.calMonth = ymd(new Date(p[0], p[1] - 2, 1)).slice(0, 7); render(); break; }
    case 'cal-next': { const p = S.ui.calMonth.split('-').map(Number); S.ui.calMonth = ymd(new Date(p[0], p[1], 1)).slice(0, 7); render(); break; }
    case 'cal-today': S.ui.calMonth = todayStr().slice(0, 7); S.ui.calSel = todayStr(); render(); break;
    case 'cal-day': S.ui.calSel = el.dataset.date; S.ui.calMonth = el.dataset.date.slice(0, 7); render(); break;
    case 'rem-tab': S.ui.remTab = el.dataset.tab; render(); break;
    case 'rem-done': { const s = S.schedules[id]; if (s) put('schedules', id, Object.assign({}, s, { remindDone: true })); break; }
    case 'rem-undo': { const s = S.schedules[id]; if (s) put('schedules', id, Object.assign({}, s, { remindDone: false })); break; }
    case 'rem-copy': { const s = S.schedules[id]; if (s) copyText(waMessage(s)); break; }
    case 'wa-log': logWa(id); break;
    case 'mon-preset': { const r = presetRange(el.dataset.p); S.ui.f.monPreset = el.dataset.p; S.ui.f.monFrom = r[0]; S.ui.f.monTo = r[1]; render(); break; }
    case 'rep-tab': S.ui.f.repTab = el.dataset.tab; render(); break;
    case 'rep-xlsx': exportXlsx(); break;
    case 'rep-pdf': exportPdf(); break;
    case 'set-save-id': { const ok = await putSettings({ clinicName: $('#set-clinic').value.trim() || DEFAULT_SETTINGS.clinicName, adminName: $('#set-admin').value.trim() }); if (ok) toast('Identitas disimpan'); break; }
    case 'set-save-rem': { const mode = $('#set-rem').value, v = Math.max(1, parseInt($('#set-rem-v').value, 10) || 30); const ok = await putSettings({ defaultRemind: { mode: mode, value: v, unit: $('#set-rem-u').value } }); if (ok) toast('Pengingat bawaan disimpan'); break; }
    case 'set-save-tpl': { const t = $('#set-tpl').value.trim(); if (!t) { toast('Templat tidak boleh kosong.', 'err'); break; } const ok = await putSettings({ template: t }); if (ok) toast('Templat pesan disimpan'); break; }
    case 'tpl-reset': { const ok = await putSettings({ template: DEFAULT_TEMPLATE }); if (ok) toast('Templat dikembalikan ke standar'); break; }
    case 'backup': exportBackup(); break;
    case 'restore-pick': $('#restore-file').click(); break;
    case 'seed-load': loadSeed(); break;
    case 'dismiss-sample': putSettings({ sampleDismissed: true }); break;
    case 'del-sample': askConfirm({ title: 'Hapus data contoh?', body: 'Dokter dan jadwal contoh yang belum Anda ubah akan dihapus, termasuk semua jadwal milik dokter contoh tersebut.', ok: 'Hapus data contoh', danger: true, fn: deleteSample }); break;
    case 'del-all': askConfirm({ title: 'Hapus semua data?', body: 'Seluruh dokter, jadwal, dan riwayat pengingat akan dihapus permanen. Unduh cadangan lebih dulu bila perlu.', ok: 'Hapus semua', danger: true, need: 'HAPUS', fn: deleteAll }); break;
    case 'm-close': closeModal(); break;
    case 'm-confirm': { const fn = M && M.fn; if (M && M.need) { const t = $('#m-typed'); if (!t || t.value.trim() !== M.need) break; } closeModal(); if (fn) await fn(); break; }
    case 'm-tab': M.tab = el.dataset.tab; renderModal(); break;
    case 'm-rk': M.remKind = el.dataset.k; renderModal(); break;
    case 'm-date-add': { if (M.pick && M.dates.indexOf(M.pick) < 0) M.dates.push(M.pick); M.pick = ''; renderModal(); break; }
    case 'm-date-del': M.dates = M.dates.filter(d => d !== el.dataset.date); renderModal(); break;
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'restore-file') { const f = el.files && el.files[0]; if (f) restoreBackup(f); el.value = ''; return; }
  if (el.id === 'set-rem') { $('#set-rem-c').hidden = el.value !== 'custom'; return; }
  if (el.dataset.act === 'set-status') { setAttendance(el.dataset.id, el.value); return; }
  if (el.dataset.act === 'set-note') { const s = S.schedules[el.dataset.id]; if (s && (s.note || '') !== el.value.trim()) put('schedules', s.id, Object.assign({}, s, { note: el.value.trim() })); return; }
  if (el.dataset.act === 'dash-set') { if (el.value) { S.ui.dashDate = el.value === todayStr() ? null : el.value; render(); } return; }
  if (el.dataset.act === 'cal-jump') { if (el.value) { S.ui.calSel = el.value; S.ui.calMonth = el.value.slice(0, 7); render(); } return; }
  if (el.dataset.act === 'cal-doc') { S.ui.calDoc = el.value; render(); return; }
  if (el.dataset.f) {
    const k = el.dataset.f; S.ui.f[k] = el.value;
    if (k === 'monFrom' || k === 'monTo') S.ui.f.monPreset = 'custom';
    render(); return;
  }
  if (M && M.kind === 'doctor') {
    if (el.dataset.mDay != null) { const v = Number(el.dataset.mDay); M.days = el.checked ? Array.from(new Set(M.days.concat(v))) : M.days.filter(x => x !== v); return; }
    if (el.dataset.m) { M[el.dataset.m] = el.type === 'checkbox' ? el.checked : el.value; return; }
  }
  if (M && M.kind === 'sched') {
    if (el.dataset.mWd != null) { const v = Number(el.dataset.mWd); M.weekdays = el.checked ? Array.from(new Set(M.weekdays.concat(v))) : M.weekdays.filter(x => x !== v); updatePreview(); return; }
    if (el.dataset.act === 'm-pick') { if (el.value && M.dates.indexOf(el.value) < 0) M.dates.push(el.value); M.pick = ''; renderModal(); return; }
    if (el.dataset.m) {
      M[el.dataset.m] = el.value;
      if (el.dataset.rr === 'doc') { const d = S.doctors[el.value]; if (d && !M.editId) { M.start = d.start; M.end = d.end; M.weekdays = (d.days || []).slice(); } renderModal(); return; }
      if (el.dataset.rr) { renderModal(); return; }
      updatePreview();
    }
  }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.f === 'docQ') { S.ui.f.docQ = el.value; render(); return; }
  if (el.id === 'set-tpl') { S.settings = Object.assign({}, S.settings); const sd = docs()[0] || { prefix: 'dr.', name: 'Contoh Dokter', suffix: 'Sp.PD', specialty: 'Spesialisasi' }; $('#set-prev').textContent = el.value.split('{nama_dokter}').join(docName(sd)).split('{spesialisasi}').join(sd.specialty).split('{tanggal}').join(fmtLong(addDays(todayStr(), 1))).split('{jam}').join('08.00–12.00 WIB').split('{klinik}').join(S.settings.clinicName); return; }
  if (el.id === 'm-typed') { updateConfirm(); return; }
  if (M && el.dataset.m && el.type !== 'checkbox' && el.tagName !== 'SELECT' && el.dataset.act !== 'm-pick') { M[el.dataset.m] = el.value; if (M.kind === 'sched') updatePreview(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (M) closeModal(); else closeMenu(); return; }
  if (e.key === 'Enter' && M && M.kind === 'doctor' && e.target.tagName === 'INPUT' && e.target.type !== 'checkbox') { e.preventDefault(); saveDoctor(); }
  if (e.key === 'Tab' && M) {
    const f = Array.from($('#modal-root').querySelectorAll('button:not([disabled]),input:not([disabled]):not([hidden]),select:not([disabled]),textarea:not([disabled])')).filter(x => x.offsetParent !== null);
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});

/* ===================== Mulai ===================== */
routeFromHash();
initStorage();
</script>
